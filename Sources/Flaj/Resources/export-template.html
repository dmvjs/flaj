<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__FLAJ_TITLE__</title>
<style>
  /* html only needs a resolvable height (so body's own height: 100% has
     something to be a percentage *of*) — its alignment doesn't matter,
     since it has exactly one child that always fills it. All the actual
     layout — sizing, centering/alignment via flex, background — belongs
     on body alone. Splitting them isn't just tidiness: body needs an
     explicit width: 100% too, or it shrinks to fit its content (the Stage
     frame) instead of filling the viewport — and once it's that narrow,
     html's own justify-content would center *body itself* in the
     viewport regardless of what alignment player.js's applyAlignment()
     sets on body, since that only ever touches body's styles, never
     html's. Invisible in Fit/Fill (the frame scales up to nearly fill the
     viewport anyway) but obvious in Actual Size, where the frame stays
     small and visibly drifted to center no matter which of the 9
     alignment points was actually picked. */
  html {
    height: 100%;
  }
  body {
    margin: 0;
    height: 100%;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: __FLAJ_PAGE_BACKGROUND__;
    overflow: hidden;
  }
  /* #flaj-frame owns the on-screen footprint (JS keeps its width/height at
     the Stage's *scaled* pixel size) and everything scale-invariant — the
     border/shadow — so they stay crisp at any zoom instead of growing fat
     right along with the content. #flaj-stage inside it stays at the
     Stage's *native* pixel size and is what actually gets transform: scale()'d,
     anchored top-left so it exactly fills its frame. */
  #flaj-frame {
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.15), 0 6px 24px rgba(0, 0, 0, 0.25);
  }
  #flaj-stage {
    position: absolute;
    top: 0;
    left: 0;
    overflow: hidden;
    transform-origin: top left;
  }
  #flaj-text-layer, #flaj-objects-layer {
    position: absolute;
    inset: 0;
  }
  .flaj-text {
    position: absolute;
    box-sizing: border-box;
    /* No overflow:hidden here on purpose — the native app's own Stage view
       never clips a text box's content either (SwiftUI's .frame() only
       sets the box for positioning), so oversized text stays visible
       there, spilling past its box rather than being silently cropped.
       #flaj-stage below *does* still clip at the Stage's own edge, which
       is a deliberate, Flash-accurate choice, not an oversight. */
    display: flex;
    align-items: flex-start;
    white-space: pre-wrap;
    line-height: 1.2;
    /* Every span here is a rotate/scale/move Web Animation candidate (see
       player.js) — promoting to its own compositor layer up front keeps a
       rotate from re-rasterizing text every frame (which reads as blur/
       jitter on a spinning box), the same way it would if left to the
       browser to notice mid-animation. */
    will-change: transform;
  }
  .flaj-object {
    position: absolute;
    white-space: pre;
    font-family: -apple-system, system-ui, sans-serif;
    will-change: transform;
  }
</style>
</head>
<body>
<div id="flaj-frame">
  <div id="flaj-stage">
    <!-- Script/stage-created objects paint behind Timeline-placed text —
         mirrors StageContentView's ZStack order in the native app, which
         draws doc.stageObjects before its placed-text layers. Swapping
         these two divs would put stage objects on top instead, the one
         place these two renderers could visibly disagree. -->
    <div id="flaj-objects-layer"></div>
    <div id="flaj-text-layer"></div>
  </div>
</div>
<script id="flaj-document" type="application/json">__FLAJ_DOCUMENT_JSON__</script>
<script>
__FLAJ_PLAYER_JS__
</script>
</body>
</html>
